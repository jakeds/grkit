# Framing: the aspect of still pictures. The page sets CORE.ASPECT, and the
# core crops each ratio from the native 3:2. The layers show the crop in the
# live view.
id = "FRAMING"
version = 1
# The default place in ADJ and in MENU: Film Look, Framing, Guides, Date, Grain.
order = 20
sources = ["framing.c"]
# Tile n shows value n. Tile 0 is the module tile, for Off at the root.
tiles = ["tiles/soft-0.png", "tiles/soft-1.png", "tiles/soft-2.png", "tiles/soft-3.png"]
uses = ["CORE.ASPECT"]

# The mask outside the photo area: 0 dark (black at 50%), 1 black, 2 frame
# lines only.
[[settings]]
key = "MASK"
values = 3
saved = true
public = true

# The ratio label: 0 on, 1 off.
[[settings]]
key = "LABEL"
values = 2
saved = true
public = true

[page]
setting = "CORE.ASPECT"
off_row = true
settings = ["CORE.ASPECT", "MASK", "LABEL"]
# The GRKit section of MENU turns each ratio on or off for ADJ.
options = true

# The mask stays in each display, because it shows the capture area.
[[layers]]
paint = "framing_mask"
setting = "CORE.ASPECT"
order = 10

# The ratio label shows with the full display, like the top row of native
# settings. It covers the guides that cross it.
[[layers]]
paint = "framing_badge"
setting = "CORE.ASPECT"
order = 30
full_disp = true
live_only = true
